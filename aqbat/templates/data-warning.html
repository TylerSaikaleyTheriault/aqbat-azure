<!-- Data Warning Modal -->
<div id="{{type}}-centred-popup-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="{{type}}-modal-title" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title" id="{{type}}-modal-title">{{i18n$t("Warning")}}</h3>
      </div>
      <div class="modal-body">
        {{message}}
      </div>
      <div class="modal-footer">
        <button id="continue-data-warning" 
          class="btn btn-primary" 
          type="button" 
          onclick="reloadWithClearedParam()"
        >  
          {{i18n$t("Continue")}}
        </button>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">{{i18n$t("Cancel")}}</button>
      </div>
    </div>
  </div>
</div>

<script>
  const reloadWithClearedParam = () => {
      // Get the current URL
      const url = new URL(window.location.href);
      const lang = document.documentElement.lang;

      if (lang === 'fr') {
          // In French, set the parameter to something like 'efface=true'
          url.searchParams.set('efface', 'vrai'); // 'efface' is a suggestion for 'cleared'
      } else {
          // Default to English
          url.searchParams.set('cleared', 'true');
      }

      // Reload the page with the new URL
      window.location.href = url.toString();
  }
</script>

  /* Ensure modal positioning remains unchanged */
  /* .modal-content {

    width: 500px;
    max-width: 100%;
    top: 200px;
  } */

  .modal-header {
    background-color: var(--primary);
    color: white !important;
    display: flex;
    flex-direction: row;
    justify-content: start;
  }

  .close {
    color: white;
    opacity: unset;
    position: absolute;
    right: 10px;
    top: 8px;
  }

  /* Custom style to ensure scrollbar is retained */
  .modal-open {
    overflow: hidden; /* Hide the overflow only in modal */
  }

  .modal-open .modal {
    padding-right: 15px; /* Adjust to match scrollbar width */
  }

</style>
