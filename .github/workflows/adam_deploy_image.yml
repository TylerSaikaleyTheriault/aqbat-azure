name: adam-deploy-image

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Creating an ephemeral runner
  createRunner:
   uses: hs/createEphemeralUbuntuRunner/.github/workflows/createEphemeralUbuntuRunner.yml@main
   with:
     ENVIRONMENT: "lz-client-hecsb-psd-aqbatwe-dt"
   secrets:
     AZURE_CREDENTIALS: ${{ secrets.HECSB_PSD_AQBATWE_CICDLZSP_DT }}

  # The build job will wait until the ephemeral runner is set up
  build:
    # The ephemeral runner will have the ephemeral_runner label
    runs-on: [ lz-client-hecsb-psd-aqbatwe-dt ]
    # Use needs to cancel job if createRunner is not successful
    needs: createRunner
    steps:
      - name: Dump repo variables (non-secret)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          # Try pretty-print with jq, fallback to raw JSON
          curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables" | jq . || curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/variables"
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Test
        run: |
          echo "hello test"