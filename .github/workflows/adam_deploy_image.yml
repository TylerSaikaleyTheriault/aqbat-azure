name: adam-deploy-image

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # Creating an ephemeral runner
  createRunner:
   uses: hs/createEphemeralUbuntuRunner/.github/workflows/createEphemeralUbuntuRunner.yml@main
   with:
     ENVIRONMENT: "lz-client-hecsb-psd-aqbatwe-dt"
   secrets:
     AZURE_CREDENTIALS: ${{ secrets.HECSB_PSD_AQBATWE_CICDLZSP_DT }}

  # The build job will wait until the ephemeral runner is set up
  build:
    # The ephemeral runner will have the ephemeral_runner label
    runs-on: [ arc-runner-set ]
    # Use needs to cancel job if createRunner is not successful
    needs: createRunner
    # Set these environment variables appropriately for your ACR and image
    env:
      # Replace with your ACR login server, e.g. myacr.azurecr.io
      ACR_LOGIN_SERVER: hcsccrrc.azurecr.io
      # ACR resource name (login server prefix) used by `az acr build`
      ACR_NAME: hcsccrrc
      # Replace with your image name (no registry), e.g. myapp/web
      IMAGE_NAME: dtb/hcweb/aqbat
      # Replace with desired tag, e.g. latest or ${{ github.sha }}
      IMAGE_TAG: latest
      # Dockerfile path and build context
      DOCKERFILE_PATH: ./Dockerfile
      BUILD_CONTEXT: .
      # The repository secret that contains the Azure service principal JSON
      AZURE_CREDENTIALS_SECRET: HECSB_PSD_AQBATWE_CICDLZSP_DT
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Login to Azure using the existing service principal secret
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.HECSB_PSD_AQBATWE_CICDLZSP_DT }}

      # Build and push the image using Azure Container Registry build (server-side)
      - name: ACR build (server-side)
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --file ${{ env.DOCKERFILE_PATH }} \
            ${{ env.BUILD_CONTEXT }}