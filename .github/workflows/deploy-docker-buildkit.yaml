name: minimal-workflow-adam

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      dockerfile:
        description: 'Dockerfile to use (default: Dockerfile for test HTML, or Dockerfile.shiny for Shiny app)'
        required: false
        default: 'Dockerfile'
        type: choice
        options:
          - Dockerfile
          - Dockerfile.shiny

jobs:
  # Creating an ephemeral runner
  createRunner:
   uses: hs/createEphemeralUbuntuRunner/.github/workflows/createEphemeralUbuntuRunner.yml@main
   with:
     environment: "lz-client-hecsb-psd-aqbatwe-dt"
   secrets:
     AZURE_CREDENTIALS: ${{ secrets.HECSB_PSD_AQBATWE_CICDLZSP_DT }}

  # The build job will wait until the ephemeral runner is set up
  build:
    # The ephemeral runner will have the label matching the environment name
    runs-on: [ lz-client-hecsb-psd-aqbatwe-dt ]
    # Use needs to cancel job if createRunner is not successful
    needs: createRunner
    # Add timeout to prevent indefinite waiting (ephemeral runner setup can take 5-10 minutes)
    timeout-minutes: 30
    env:
      ACR_NAME: "hcsccrrc"
      ACR_LOGIN_SERVER: "hcsccrrc.azurecr.io"
      ACR_IMAGE_REPOSITORY: "dtb/aqbat/shiny"
      AZ_SUBSCRIPTION_ID: "bee5b843-636e-44ec-9d05-8d8ef22e718f"
    steps:

      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Check Docker
        run: |
          echo "Checking if Docker is available..."
          if command -v docker &> /dev/null; then
            docker --version
            if docker info &> /dev/null 2>&1; then
              echo "✓ Docker is already working"
            else
              echo "Docker command exists but daemon not running"
            fi
          else
            echo "Docker command not found"
          fi
      
      - name: Setup Docker
        uses: docker/setup-docker-action@v4
        continue-on-error: true
      
      - name: Verify Docker works
        run: |
          echo "Verifying Docker is working..."
          docker --version || (echo "ERROR: Docker not available" && exit 1)
          if ! docker info &> /dev/null 2>&1; then
            echo "ERROR: Docker daemon is not accessible"
            echo "This may indicate a problem with the ephemeral runner setup"
            exit 1
          fi
          echo "✓ Docker is working correctly"
          docker info | head -3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.HECSB_PSD_AQBATWE_CICDLZSP_DT }}

      - name: Build and push Docker image to ACR
        run: |
          export DOCKER_BUILDKIT=1
          # Set subscription just to be explicit
          az account set --subscription "$AZ_SUBSCRIPTION_ID"

          # Log in to ACR using the SP (which has AcrPush)
          az acr login --name "$ACR_NAME"

          IMAGE_TAG=${GITHUB_RUN_ID}
          IMAGE_NAME="${ACR_LOGIN_SERVER}/${ACR_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          LATEST_NAME="${ACR_LOGIN_SERVER}/${ACR_IMAGE_REPOSITORY}:latest"

          # Try to pull the latest image to use as cache (if it exists)
          # This allows Docker to reuse layers, especially the expensive R package installation layer
          # NOTE: Service principal needs AcrPull permission for this to work
          echo "Pulling latest image for cache..."
          if docker pull "${LATEST_NAME}" 2>/dev/null; then
            echo "Successfully pulled latest image for cache"
          else
            echo "Warning: Could not pull latest image (may need AcrPull permission or image doesn't exist)"
            echo "Building from scratch without cache..."
          fi

          # Determine which Dockerfile to use
          DOCKERFILE="${{ inputs.dockerfile || 'Dockerfile' }}"
          echo "Building AQBAT image: ${IMAGE_NAME} using ${DOCKERFILE}"
          
          # Build with cache from the latest image (if available)
          # Docker will use partial caching - it will reuse valid layers and rebuild invalid ones
          # If cache is corrupted, Docker will skip that layer and rebuild it
          if [ "$CACHE_AVAILABLE" = true ]; then
            # Try with cache, but continue even if cache restoration fails
            if [ "$DOCKERFILE" = "Dockerfile.shiny" ]; then
              docker build \
                --cache-from "${LATEST_NAME}" \
                --file Dockerfile.shiny \
                --tag "${IMAGE_NAME}" \
                --tag "${LATEST_NAME}" \
                . || {
                echo "Warning: Build with cache failed, retrying without cache..."
                docker build \
                  --file Dockerfile.shiny \
                  --tag "${IMAGE_NAME}" \
                  --tag "${LATEST_NAME}" \
                  .
              }
            else
              docker build \
                --cache-from "${LATEST_NAME}" \
                --tag "${IMAGE_NAME}" \
                --tag "${LATEST_NAME}" \
                . || {
                echo "Warning: Build with cache failed, retrying without cache..."
                docker build \
                  --tag "${IMAGE_NAME}" \
                  --tag "${LATEST_NAME}" \
                  .
              }
            fi
          else
            # Build without cache
            if [ "$DOCKERFILE" = "Dockerfile.shiny" ]; then
              docker build \
                --file Dockerfile.shiny \
                --tag "${IMAGE_NAME}" \
                --tag "${LATEST_NAME}" \
                .
            else
              docker build \
                --tag "${IMAGE_NAME}" \
                --tag "${LATEST_NAME}" \
                .
            fi
          fi

          echo "Pushing both tags to ACR"
          docker push "${IMAGE_NAME}"
          docker push "${LATEST_NAME}"