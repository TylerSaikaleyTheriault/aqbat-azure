name: Daily Hello World & Failure Check

on:
  schedule:
    - cron: '0 8 * * *' # Run daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      trigger_failure:
        description: 'Force a workflow failure to test native notifications'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # 1) Dynamically create the self-hosted ephemeral runner
  createRunner:
    uses: hs/createEphemeralUbuntuRunner/.github/workflows/createEphemeralUbuntuRunner.yml@main
    with:
      environment: "lz-client-hecsb-psd-aqbatwe-dt"
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.HECSB_PSD_AQBATWE_CICDLZSP_DT }}

  # 2) Run the daily task on the provisioned runner
  run-daily-task:
    runs-on: [ lz-client-hecsb-psd-aqbatwe-dt ]
    needs: createRunner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Hello World
        run: |
          echo "Hello, World!"
          echo "Workflow started successfully."

      # Step to intentionally trigger a failure for testing purposes
      - name: Force Failure (Test Toggle)
        if: ${{ inputs.trigger_failure == true }}
        run: |
          echo "::error::Forcing workflow failure for native notification testing."
          exit 1
