name: Daily Hello World & Failure Check

on:
  schedule:
    - cron: '0 8 * * *' # Run daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      trigger_failure:
        description: 'Force a workflow failure to test native notifications'
        required: false
        type: boolean
        default: false

jobs:
  run-daily-task:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print Hello World
        run: |
          echo "Hello, World!"
          echo "Workflow started successfully."

      # Step to intentionally trigger a failure for testing purposes
      - name: Force Failure (Test Toggle)
        if: ${{ inputs.trigger_failure == true }}
        run: |
          echo "::error::Forcing workflow failure for native notification testing."
          exit 1
